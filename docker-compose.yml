services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: signbridge
      MYSQL_USER: signbridge
      MYSQL_PASSWORD: signbridge_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - signbridge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: signbridge
      DB_USERNAME: signbridge
      DB_PASSWORD: signbridge_dev_password
      DB_SSL_MODE: DISABLED
      JWT_SECRET: local-compose-signbridge-secret-change-before-production-123456
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  signbridge_mysql_data:
