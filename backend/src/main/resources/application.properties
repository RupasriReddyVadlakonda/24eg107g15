
spring.application.name=signbridge
server.port=${PORT:8080}

# Active Spring profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================================
# MySQL Database - Aiven / Render
# ==========================================

# If SPRING_DATASOURCE_URL is provided, use it.
# Otherwise, construct the URL from the DB_* variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:signbridge}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:signbridge}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Health endpoint
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# Redis (optional)
# ==========================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# ==========================================
# Security / JWT
# ==========================================

app.jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# CORS - Netlify frontend
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://24eg107g15.netlify.app}

# ==========================================
# Optional AI integration
# ==========================================

app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
