spring.application.name=signbridge
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MySQL (Aiven or another managed MySQL provider).
# Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME and DB_PASSWORD in Render.
# TLS is required by default for managed hosting; use DB_SSL_MODE=DISABLED only for local Docker MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:signbridge}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:signbridge}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Optional integration settings; Redis is not required by the starter's basic workflow.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Security/optional AI configuration. Set JWT_SECRET in Render; never commit real secrets.
app.jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
